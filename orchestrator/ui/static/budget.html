<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Dashboard — AI Orchestrator</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --primary: #3b82f6;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }
        
        .last-refresh {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .refresh-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
        }
        
        .refresh-btn:hover {
            background: #2563eb;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .provider-name {
            font-size: 1.125rem;
            font-weight: 600;
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-ok {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        
        .status-low {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .status-crit {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .status-unknown {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .metric-value {
            font-weight: 600;
        }
        
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .progress-fill.ok {
            background: var(--success);
        }
        
        .progress-fill.low {
            background: var(--warning);
        }
        
        .progress-fill.crit {
            background: var(--danger);
        }
        
        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
        }
        
        .summary {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .summary-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        nav {
            margin-bottom: 2rem;
        }
        
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-right: 1.5rem;
            transition: color 0.2s;
        }
        
        nav a:hover,
        nav a.active {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Home</a>
            <a href="/workers">Workers</a>
            <a href="/budget" class="active">Budget</a>
            <a href="/receipts">Receipts</a>
        </nav>
        
        <header>
            <h1>Budget Dashboard</h1>
            <div>
                <span class="last-refresh" id="lastRefresh">Last refresh: --</span>
                <button class="refresh-btn" onclick="refreshBudget()">Refresh Now</button>
            </div>
        </header>
        
        <div class="summary" id="summaryCard">
            <h2 style="margin-bottom: 1rem;">Quota Summary</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-value" id="totalProviders">--</div>
                    <div class="summary-label">Total Providers</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="healthyProviders">--</div>
                    <div class="summary-label">Healthy</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="lowQuotaProviders">--</div>
                    <div class="summary-label">Low Quota</div>
                </div>
            </div>
        </div>
        
        <div class="grid" id="providerGrid">
            <!-- Provider cards loaded dynamically -->
        </div>
    </div>
    
    <script>
        async function loadBudget() {
            try {
                const response = await fetch('/api/budget');
                const data = await response.json();
                
                renderBudget(data);
            } catch (error) {
                console.error('Failed to load budget:', error);
                document.getElementById('providerGrid').innerHTML = `
                    <div class="card" style="grid-column: 1 / -1;">
                        <p style="color: var(--danger);">Failed to load budget data: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        function renderBudget(data) {
            const grid = document.getElementById('providerGrid');
            const lastRefresh = document.getElementById('lastRefresh');
            
            if (!data || !data.probes || data.probes.length === 0) {
                grid.innerHTML = `
                    <div class="card" style="grid-column: 1 / -1;">
                        <p>No budget probes found. Run 'orchestrator cli refresh-budget' first.</p>
                    </div>
                `;
                return;
            }
            
            // Update last refresh time
            if (data.probes[0].probed_at) {
                const date = new Date(data.probes[0].probed_at);
                lastRefresh.textContent = `Last refresh: ${date.toLocaleString()}`;
            }
            
            // Calculate summary
            const total = data.probes.length;
            const healthy = data.probes.filter(p => p.ok && p.remaining > p.limit * 0.5).length;
            const low = data.probes.filter(p => p.ok && p.remaining <= p.limit * 0.5 && p.remaining > p.limit * 0.2).length;
            
            document.getElementById('totalProviders').textContent = total;
            document.getElementById('healthyProviders').textContent = healthy;
            document.getElementById('lowQuotaProviders').textContent = low;
            
            // Render provider cards
            grid.innerHTML = data.probes.map(probe => {
                const pct = probe.limit > 0 ? (probe.remaining / probe.limit * 100) : 0;
                let statusClass = 'status-unknown';
                let progressClass = 'crit';
                
                if (!probe.ok) {
                    statusClass = 'status-unknown';
                } else if (pct > 50) {
                    statusClass = 'status-ok';
                    progressClass = 'ok';
                } else if (pct > 20) {
                    statusClass = 'status-low';
                    progressClass = 'low';
                } else {
                    statusClass = 'status-crit';
                    progressClass = 'crit';
                }
                
                const statusText = !probe.ok ? 'UNKNOWN' : pct > 50 ? 'OK' : pct > 20 ? 'LOW' : 'CRITICAL';
                
                return `
                    <div class="card">
                        <div class="card-header">
                            <span class="provider-name">${probe.provider_id}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Remaining</span>
                            <span class="metric-value">${probe.remaining?.toLocaleString() || 'N/A'}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Limit</span>
                            <span class="metric-value">${probe.limit?.toLocaleString() || 'N/A'}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Usage</span>
                            <span class="metric-value">${pct.toFixed(1)}% remaining</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${progressClass}" style="width: ${Math.min(100, Math.max(0, pct))}%"></div>
                        </div>
                        ${probe.error ? `<div class="error-message">${probe.error}</div>` : ''}
                        <div class="metric-row" style="margin-top: 0.75rem;">
                            <span class="metric-label">Probed at</span>
                            <span class="metric-value" style="font-size: 0.75rem;">${probe.probed_at ? new Date(probe.probed_at).toLocaleString() : 'N/A'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function refreshBudget() {
            const btn = document.querySelector('.refresh-btn');
            btn.disabled = true;
            btn.textContent = 'Refreshing...';
            
            try {
                const response = await fetch('/api/budget/refresh', { method: 'POST' });
                const data = await response.json();
                loadBudget();
            } catch (error) {
                console.error('Failed to refresh:', error);
                alert('Failed to refresh budget: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh Now';
            }
        }
        
        // Load on page load
        loadBudget();
        
        // Auto-refresh every 60 seconds
        setInterval(loadBudget, 60000);
    </script>
</body>
</html>
