<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Budgets - AI Orchestrator</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #151c2f;
            --card: #1b2438;
            --line: #313b52;
            --text: #eef3fb;
            --muted: #9aa8bd;
            --good: #32c273;
            --warn: #e8ad36;
            --bad: #f05b5b;
            --blue: #62a8ff;
            --cyan: #4dcbd1;
        }

        * { box-sizing: border-box; }
        html {
            min-height: 100%;
            overflow-y: auto;
        }
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
            overflow-y: auto;
        }
        .wrap { max-width: 1320px; margin: 0 auto; min-height: 100vh; padding: 18px 18px 48px; }
        nav { display: flex; gap: 18px; margin-bottom: 18px; }
        nav a { color: var(--muted); text-decoration: none; }
        nav a.active, nav a:hover { color: var(--text); }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 16px;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: 0; }
        .subhead { color: var(--muted); margin-top: 4px; max-width: 780px; }
        .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        button {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 6px;
            padding: 7px 11px;
            cursor: pointer;
            font: inherit;
        }
        button.primary { background: var(--blue); border-color: var(--blue); color: #06101d; font-weight: 700; }
        button:disabled { opacity: .55; cursor: wait; }
        .tabs { display: flex; gap: 6px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
        .tab {
            border: 0;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            background: transparent;
            color: var(--muted);
            padding: 8px 12px;
        }
        .tab.on { color: var(--text); border-color: var(--blue); }
        .pane { display: none; }
        .pane.on { display: block; }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .metric, .card, .tablebox {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        .metric { padding: 13px; }
        .metric .value { font-size: 22px; font-weight: 750; color: var(--cyan); }
        .metric .label { color: var(--muted); margin-top: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
        .card { padding: 14px; }
        .cardhead { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
        .pill {
            display: inline-flex;
            align-items: center;
            height: 23px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .ok { color: var(--good); background: rgba(50, 194, 115, .14); }
        .warn { color: var(--warn); background: rgba(232, 173, 54, .14); }
        .bad { color: var(--bad); background: rgba(240, 91, 91, .14); }
        .muted { color: var(--muted); background: rgba(154, 168, 189, .14); }
        .rows { display: grid; gap: 6px; }
        .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid rgba(49, 59, 82, .72); }
        .row:first-child { border-top: 0; }
        .label { color: var(--muted); min-width: 110px; }
        .value { font-weight: 650; text-align: right; overflow-wrap: anywhere; }
        .bar { height: 8px; background: #0f1728; border-radius: 999px; overflow: hidden; margin: 10px 0 3px; }
        .fill { height: 100%; background: var(--good); width: 0; }
        .fill.low { background: var(--warn); }
        .fill.critical { background: var(--bad); }
        .note { color: var(--muted); font-size: 12px; margin-top: 8px; overflow-wrap: anywhere; }
        .error { color: var(--bad); background: rgba(240, 91, 91, .09); padding: 8px; border-radius: 6px; margin-top: 10px; }
        .tablebox { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .empty { color: var(--muted); padding: 18px; text-align: center; }
        .last { color: var(--muted); font-size: 12px; }
        @media (max-width: 780px) {
            .wrap { padding: 12px; }
            header { display: block; }
            .actions { justify-content: flex-start; margin-top: 12px; }
            .summary { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <nav>
            <a href="/">Home</a>
            <a href="/workers">Workers</a>
            <a href="/budget" class="active">Budgets</a>
            <a href="/receipts">Receipts</a>
        </nav>

        <header>
            <div>
                <h1>Budgets</h1>
                <div class="subhead">Subscription tokens are account scoped. API budgets are owner policy caps and stay separate.</div>
            </div>
            <div class="actions">
                <span class="last" id="lastRefresh">Last refresh: --</span>
                <button class="primary" id="refreshSubscriptions" onclick="refreshSubscriptions()">Refresh subscriptions</button>
                <button id="refreshApi" onclick="refreshApiBudget()">Refresh API probes</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab on" data-pane="subscriptions" onclick="showPane('subscriptions')">Subscriptions</button>
            <button class="tab" data-pane="api" onclick="showPane('api')">API Budgets</button>
        </div>

        <section class="pane on" id="subscriptions">
            <div class="summary">
                <div class="metric"><div class="value" id="subCount">--</div><div class="label">Subscriptions</div></div>
                <div class="metric"><div class="value" id="provedCount">--</div><div class="label">Usage proved</div></div>
                <div class="metric"><div class="value" id="appTokens">--</div><div class="label">Used in app</div></div>
                <div class="metric"><div class="value" id="provedWindows">--</div><div class="label">Quota windows</div></div>
            </div>
            <div class="grid" id="subscriptionGrid"></div>
        </section>

        <section class="pane" id="api">
            <div class="summary">
                <div class="metric"><div class="value" id="apiPolicyCount">--</div><div class="label">Policy caps</div></div>
                <div class="metric"><div class="value" id="apiProviderCount">--</div><div class="label">Providers seen</div></div>
                <div class="metric"><div class="value" id="apiProbeCount">--</div><div class="label">Legacy probes</div></div>
                <div class="metric"><div class="value">Uncapped</div><div class="label">Default API stance</div></div>
            </div>
            <div class="tablebox" id="apiPolicyTable"></div>
            <div style="height:12px"></div>
            <div class="tablebox" id="legacyProbeTable"></div>
        </section>
    </div>

    <script>
        let subscriptionPayload = null;
        let apiPayload = null;

        const fmt = value => value === null || value === undefined ? "unproved" : Number(value).toLocaleString();
        const pct = value => value === null || value === undefined || Number.isNaN(Number(value)) ? "unproved" : `${Number(value).toFixed(1)}%`;
        const esc = value => String(value === null || value === undefined ? "" : value)
            .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function showPane(name) {
            document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("on", tab.dataset.pane === name));
            document.querySelectorAll(".pane").forEach(pane => pane.classList.toggle("on", pane.id === name));
        }

        async function loadAll() {
            await Promise.all([loadSubscriptions(), loadApiBudgets()]);
        }

        async function loadSubscriptions() {
            try {
                const response = await fetch("/api/subscriptions");
                subscriptionPayload = await response.json();
                renderSubscriptions(subscriptionPayload);
            } catch (error) {
                document.getElementById("subscriptionGrid").innerHTML = `<div class="card error">Subscription usage failed: ${esc(error.message)}</div>`;
            }
        }

        async function loadApiBudgets() {
            try {
                const response = await fetch("/api/api-budgets");
                apiPayload = await response.json();
                renderApiBudgets(apiPayload);
            } catch (error) {
                document.getElementById("apiPolicyTable").innerHTML = `<div class="empty">API budget load failed: ${esc(error.message)}</div>`;
            }
        }

        function renderSubscriptions(data) {
            const rows = data.subscriptions || [];
            const totals = data.totals || {};
            document.getElementById("subCount").textContent = totals.subscriptions ?? rows.length;
            document.getElementById("provedCount").textContent = totals.proved_usage ?? rows.filter(r => r.ok).length;
            document.getElementById("appTokens").textContent = fmt(totals.app_tokens || 0);
            document.getElementById("provedWindows").textContent = fmt(totals.proved_windows || 0);
            const checked = rows.map(r => r.checked_at).filter(Boolean).sort().pop();
            document.getElementById("lastRefresh").textContent = checked ? `Last refresh: ${new Date(checked).toLocaleString()}` : "Last refresh: unproved";
            const grid = document.getElementById("subscriptionGrid");
            if (!rows.length) {
                grid.innerHTML = `<div class="card empty">No subscription snapshots yet. Refresh subscriptions to probe logged-in CLIs.</div>`;
                return;
            }
            grid.innerHTML = rows.map(renderSubscriptionCard).join("");
        }

        function renderSubscriptionCard(row) {
            const windows = parseWindows(row.usage_windows_json);
            const pctRemaining = row.tokens_limit && row.tokens_remaining !== null && row.tokens_remaining !== undefined
                ? Math.max(0, Math.min(100, row.tokens_remaining / row.tokens_limit * 100))
                : null;
            const status = row.status === "auth_required" ? "warn"
                : row.ok && windows.length ? "ok"
                : row.confidence === "cli_exact" ? (pctRemaining === null ? "ok" : pctRemaining > 30 ? "ok" : pctRemaining > 15 ? "warn" : "bad")
                : row.ok ? "warn" : "muted";
            const statusText = row.status === "auth_required" ? "auth needed"
                : row.ok && windows.length ? "windows proved"
                : row.confidence === "cli_exact" ? "proved"
                : row.ok ? "account only" : "unproved";
            const fillClass = pctRemaining === null ? "" : pctRemaining > 30 ? "" : pctRemaining > 15 ? "low" : "critical";
            return `
                <article class="card">
                    <div class="cardhead">
                        <div class="name">${esc(row.subscription_name || row.service_id)}</div>
                        <span class="pill ${status}">${statusText}</span>
                    </div>
                    ${pctRemaining === null ? "" : `<div class="bar"><div class="fill ${fillClass}" style="width:${pctRemaining}%"></div></div>`}
                    <div class="rows">
                        <div class="row"><span class="label">Account</span><span class="value">${esc(row.account_id || "unproved")}</span></div>
                        <div class="row"><span class="label">Profile</span><span class="value">${esc(row.profile_id || "default")}</span></div>
                        <div class="row"><span class="label">Plan</span><span class="value">${esc(row.plan_name || "unproved")}</span></div>
                        <div class="row"><span class="label">Used in app</span><span class="value">${fmt(row.tokens_used_by_app || 0)}</span></div>
                        <div class="row"><span class="label">Provider windows</span><span class="value">${windows.length ? `${windows.length} proved` : "unproved"}</span></div>
                        <div class="row"><span class="label">Total used</span><span class="value">${fmt(row.tokens_used_total)}</span></div>
                        <div class="row"><span class="label">Remaining</span><span class="value">${fmt(row.tokens_remaining)}</span></div>
                        <div class="row"><span class="label">Limit</span><span class="value">${fmt(row.tokens_limit)}</span></div>
                        <div class="row"><span class="label">Reset</span><span class="value">${esc(row.reset_at || "unproved")}</span></div>
                    </div>
                    ${windows.length ? renderUsageWindows(windows) : ""}
                    <div class="note">Source: ${esc(row.source_command || "not found")}</div>
                    ${row.error ? `<div class="note">${esc(row.error)}</div>` : ""}
                </article>
            `;
        }

        function parseWindows(raw) {
            if (Array.isArray(raw)) return raw;
            try {
                const parsed = JSON.parse(raw || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function renderUsageWindows(windows) {
            return `<div class="rows" style="margin-top:10px">${
                windows.map(window => {
                    const remaining = Number(window.remaining_percent);
                    const width = Number.isFinite(remaining) ? Math.max(0, Math.min(100, remaining)) : 0;
                    const fill = width > 30 ? "" : width > 15 ? "low" : "critical";
                    const currentText = window.current !== null && window.current !== undefined
                        ? `${fmt(window.current)} ${esc(String(window.unit || "units").replaceAll("_", " "))}`
                        : `${pct(window.remaining_percent)} left / ${pct(window.used_percent)} used`;
                    return `
                        <div>
                            <div class="row">
                                <span class="label">${esc(window.label || "window")}</span>
                                <span class="value">${currentText}</span>
                            </div>
                            ${Number.isFinite(remaining) ? `<div class="bar"><div class="fill ${fill}" style="width:${width}%"></div></div>` : ""}
                            <div class="note">Reset: ${esc(window.reset_at || "unproved")}</div>
                        </div>
                    `;
                }).join("")
            }</div>`;
        }

        function renderApiBudgets(data) {
            const policies = data.policies || [];
            const legacy = data.legacy_probes || [];
            document.getElementById("apiPolicyCount").textContent = policies.length;
            document.getElementById("apiProviderCount").textContent = (data.providers_seen || []).length;
            document.getElementById("apiProbeCount").textContent = legacy.length;
            document.getElementById("apiPolicyTable").innerHTML = policies.length
                ? table(["Provider", "Account", "Policy", "Limit", "Spend", "Window", "Enabled"], policies.map(p => [
                    p.provider_id, p.account_id || "default", p.policy_name || "owner cap", money(p.budget_limit_usd),
                    money(p.current_spend_usd), p.budget_window || "unset", p.enabled ? "yes" : "no"
                ]))
                : `<div class="empty">No owner API caps configured. API use is uncapped until a policy row exists.</div>`;
            document.getElementById("legacyProbeTable").innerHTML = legacy.length
                ? table(["Provider", "Probe", "Remaining", "Limit", "Status", "Checked"], legacy.map(p => [
                    p.provider_id, p.probe_type, fmt(p.remaining), fmt(p.limit), p.ok ? "ok" : "failed", p.probed_at || ""
                ]))
                : `<div class="empty">No legacy API probes recorded.</div>`;
        }

        function table(headers, rows) {
            return `<table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
                rows.map(row => `<tr>${row.map((cell, i) => `<td class="${i >= 3 ? "num" : ""}">${esc(cell)}</td>`).join("")}</tr>`).join("")
            }</tbody></table>`;
        }

        function money(value) {
            return value === null || value === undefined ? "uncapped" : `$${Number(value).toFixed(2)}`;
        }

        async function refreshSubscriptions() {
            const btn = document.getElementById("refreshSubscriptions");
            btn.disabled = true;
            btn.textContent = "Refreshing...";
            try {
                const response = await fetch("/api/subscriptions/refresh", { method: "POST" });
                subscriptionPayload = await response.json();
                renderSubscriptions(subscriptionPayload);
            } catch (error) {
                alert(`Subscription refresh failed: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = "Refresh subscriptions";
            }
        }

        async function refreshApiBudget() {
            const btn = document.getElementById("refreshApi");
            btn.disabled = true;
            btn.textContent = "Refreshing...";
            try {
                await fetch("/api/budget/refresh", { method: "POST" });
                await loadApiBudgets();
            } catch (error) {
                alert(`API probe refresh failed: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = "Refresh API probes";
            }
        }

        loadAll();
        setInterval(loadAll, 60000);
    </script>
</body>
</html>
