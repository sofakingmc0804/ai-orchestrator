[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Standalone AI operating layer and orchestrator for local and subscription-backed AI services."
requires-python = ">=3.13"
dependencies = [
  "aiosqlite",
  "fastapi>=0.115,<0.116",
  "httpx",
  "psutil",
  "pydantic",
  "PyYAML",
  "starlette>=0.40,<0.47",
  "uvicorn",
  "watchdog",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
namespaces = true

[tool.setuptools.package-data]
"orchestrator.state" = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["psutil", "yaml"]
ignore_missing_imports = true
